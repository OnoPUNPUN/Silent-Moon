services:
  postgres:
    image: postgres:16-alpine
    container_name: reading_library_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: reading_library
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reading_library"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reading_library_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      HTTP_PORT: 8080
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/reading_library?sslmode=disable
      JWT_ACCESS_SECRET: dev-insecure-secret-key-1234567890
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 720h
      ALLOWED_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
